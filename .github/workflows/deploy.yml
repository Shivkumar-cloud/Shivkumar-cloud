name: Build data pipeline and deploy Pune Typology Explorer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install osmium-tool and tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool tippecanoe

      - name: Install go-pmtiles
        run: |
          go install github.com/protomaps/go-pmtiles@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch Pune's real administrative boundary
        working-directory: city-viewer/pipeline
        run: node fetch-boundary.cjs pune-boundary.geojson pune.poly

      - name: Download OSM extract for Maharashtra (falls back to all-India)
        working-directory: city-viewer/pipeline
        env:
          STATE_PBF_URL: https://download.geofabrik.de/asia/india/maharashtra-latest.osm.pbf
          COUNTRY_PBF_URL: https://download.geofabrik.de/asia/india-latest.osm.pbf
        run: |
          set -e
          fetch_and_validate() {
            local url="$1"
            echo "Trying $url"
            curl -fL --retry 4 --retry-delay 5 -o region.osm.pbf "$url" || return 1
            osmium fileinfo region.osm.pbf > /dev/null 2>&1 || return 1
          }
          if fetch_and_validate "$STATE_PBF_URL"; then
            echo "Using Maharashtra state extract"
          elif fetch_and_validate "$COUNTRY_PBF_URL"; then
            echo "Maharashtra extract unavailable or invalid; using all-India extract instead"
          else
            echo "::error::Could not download a valid OSM PBF extract from Geofabrik"
            exit 1
          fi
          ls -la region.osm.pbf
          osmium fileinfo region.osm.pbf

      - name: Extract Pune from the region extract
        working-directory: city-viewer/pipeline
        run: osmium extract -p pune.poly --strategy=smart -o pune.osm.pbf --overwrite region.osm.pbf

      - name: Filter to tagged buildings only
        working-directory: city-viewer/pipeline
        run: osmium tags-filter -o pune-buildings.osm.pbf --overwrite pune.osm.pbf w/building

      - name: Export building polygons to GeoJSONSeq
        working-directory: city-viewer/pipeline
        run: |
          osmium export pune-buildings.osm.pbf \
            -f geojsonseq -o pune-buildings.geojsonseq --overwrite \
            -a type,id --geometry-types=polygon

      - name: Classify buildings by typology
        working-directory: city-viewer/pipeline
        run: node classify.cjs pune-buildings.geojsonseq > classified.ndjson

      - name: Build vector tiles (tippecanoe)
        working-directory: city-viewer/pipeline
        run: |
          tippecanoe -o buildings.mbtiles \
            --name="Pune Buildings" \
            --attribution="© OpenStreetMap contributors" \
            --layer=buildings \
            --minimum-zoom=10 --maximum-zoom=16 \
            --drop-densest-as-needed \
            --force \
            classified.ndjson

      - name: Convert to PMTiles
        working-directory: city-viewer/pipeline
        run: go-pmtiles convert buildings.mbtiles buildings.pmtiles

      - name: Upload PMTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildings-pmtiles
          path: city-viewer/pipeline/buildings.pmtiles
          retention-days: 7

      # POIs (traffic signals, pedestrian crossings, bus stops) are point
      # nodes, a completely separate extraction from the building polygons
      # above, so they're filtered from the same region-wide pune.osm.pbf
      # rather than the buildings-only subset.
      - name: Filter to traffic/POI nodes
        working-directory: city-viewer/pipeline
        run: |
          osmium tags-filter -o pune-pois.osm.pbf --overwrite pune.osm.pbf \
            n/highway=traffic_signals,crossing,bus_stop n/public_transport=platform

      - name: Export POI points to GeoJSONSeq
        working-directory: city-viewer/pipeline
        run: |
          osmium export pune-pois.osm.pbf \
            -f geojsonseq -o pune-pois.geojsonseq --overwrite \
            -a type,id --geometry-types=point

      - name: Classify POIs
        working-directory: city-viewer/pipeline
        run: node classify-poi.cjs pune-pois.geojsonseq > classified-pois.ndjson

      - name: Build POI vector tiles (tippecanoe)
        working-directory: city-viewer/pipeline
        run: |
          tippecanoe -o pois.mbtiles \
            --name="Pune Traffic/POIs" \
            --attribution="© OpenStreetMap contributors" \
            --layer=pois \
            --minimum-zoom=12 --maximum-zoom=16 \
            --force \
            classified-pois.ndjson

      - name: Convert POIs to PMTiles
        working-directory: city-viewer/pipeline
        run: go-pmtiles convert pois.mbtiles pois.pmtiles

      - name: Upload POI PMTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: pois-pmtiles
          path: city-viewer/pipeline/pois.pmtiles
          retention-days: 7

      # Self-hosted basemap (roads, water, labels), extracted from the
      # Protomaps daily planet build down to just the Pune area. Serving this
      # from our own origin alongside buildings.pmtiles avoids depending on a
      # third-party tile CDN, and avoids hotlinking OSM's tile servers, which
      # their usage policy asks deployments not to do.
      - name: Extract Pune basemap from the Protomaps daily build
        working-directory: city-viewer/pipeline
        run: |
          set -e
          # Protomaps publishes a daily planet build as build.protomaps.com/YYYYMMDD.pmtiles.
          # There is no stable "latest" alias, and today's build may not be
          # published yet, so walk backwards until one resolves.
          BUILD_URL=""
          for i in $(seq 0 9); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            candidate="https://build.protomaps.com/${d}.pmtiles"
            if curl -fsI --max-time 30 "$candidate" > /dev/null 2>&1; then
              BUILD_URL="$candidate"
              echo "Using Protomaps daily build: $d"
              break
            fi
          done
          if [ -z "$BUILD_URL" ]; then
            echo "::error::No Protomaps daily build found in the last 10 days"
            exit 1
          fi

          # Reuse the same boundary the building extract used, reduced to its
          # bounding box (go-pmtiles --bbox is the most predictable input, and
          # a rectangle is fine for a basemap backdrop).
          BBOX=$(node -e "
            const fs = require('fs');
            const f = JSON.parse(fs.readFileSync('pune-boundary.geojson', 'utf8'));
            const g = f.geometry || f;
            const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const poly of polys) for (const ring of poly) for (const [x, y] of ring) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
            console.log([minX, minY, maxX, maxY].join(','));
          ")
          echo "Extracting bbox: $BBOX"

          # z15 is the Protomaps planet's max zoom; MapLibre overzooms past it
          # for closer views, and our own building tiles carry the detail there.
          go-pmtiles extract "$BUILD_URL" basemap.pmtiles --bbox="$BBOX" --maxzoom=15
          ls -la basemap.pmtiles

      - name: Upload basemap PMTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: basemap-pmtiles
          path: city-viewer/pipeline/basemap.pmtiles
          retention-days: 7

  build-site:
    needs: build-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: city-viewer/package-lock.json

      - name: Download PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: buildings-pmtiles
          path: city-viewer/public

      - name: Download POI PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: pois-pmtiles
          path: city-viewer/public

      - name: Download basemap PMTiles artifact
        uses: actions/download-artifact@v4
        with:
          name: basemap-pmtiles
          path: city-viewer/public

      - working-directory: city-viewer
        run: npm ci
      - working-directory: city-viewer
        run: npm run build

      # upload-pages-artifact publishes the given path's *contents* as the
      # site root. vite.config.js builds asset URLs assuming the app is
      # served from /Shivkumar-cloud/city-viewer/ (to keep the same URL the
      # old viewer used), so the built output must be nested under a
      # city-viewer/ folder in the artifact, not uploaded as the site root.
      - name: Stage built site under /city-viewer/
        run: |
          mkdir -p site/city-viewer
          cp -r city-viewer/dist/. site/city-viewer/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
